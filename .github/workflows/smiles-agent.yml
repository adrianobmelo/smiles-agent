name: Smiles Agent

on:
  schedule:
    # 10:17 UTC = 07:17 em Brasília (sem horário de verão desde 2019).
    # O GitHub atrasa agendamentos em horários cheios (minuto 0) e já chegou a
    # rodar este com 4h de atraso. Minuto quebrado e início mais cedo reduzem
    # o atraso, mas não há garantia de horário exato.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      teste_telegram:
        description: "Mandar mensagem de teste no Telegram"
        type: boolean
        default: false
      debug:
        description: "Escrever no log o que a Smiles devolveu"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smiles-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar agente
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMILES_API_KEY: ${{ secrets.SMILES_API_KEY }}
          SMILES_TESTE_TELEGRAM: ${{ inputs.teste_telegram }}
          SMILES_DEBUG: ${{ inputs.debug }}
        run: python agent.py

      - name: Salvar histórico
        run: |
          if git diff --quiet -- historico.json; then
            echo "Histórico sem alterações"
            exit 0
          fi
          git config user.name "smiles-agent"
          git config user.email "smiles-agent@users.noreply.github.com"
          git add historico.json
          git commit -m "smiles-agent: histórico $(TZ=America/Sao_Paulo date +%F)"
          git push
