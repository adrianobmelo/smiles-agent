name: Sondagem de fontes

on:
  workflow_dispatch:

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar fontes candidatas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in \
            https://www.melhoresdestinos.com.br/feed \
            https://www.melhoresdestinos.com.br/milhas/feed \
            https://www.melhoresdestinos.com.br/tag/smiles/feed \
            https://www.melhoresdestinos.com.br/milhas/smiles-passagens-gol-20mai26 \
            https://passageirodeprimeira.com/feed/ \
            https://passageirodeprimeira.com/tag/smiles/feed/ \
            https://www.tripmilhas.com/calendario ; do
            echo "=================== $u"
            curl -sS -L -m 20 -A "$UA" -o /tmp/p -w "status=%{http_code} tipo=%{content_type} bytes=%{size_download}\n" "$u" || true
            grep -o '<title>[^<]*</title>' /tmp/p | head -8 || true
            grep -oiE '[0-9]{1,3}(\.[0-9]{3})+ milhas[^<]{0,80}' /tmp/p | head -8 || true
          done
